schema = 2

# Per-class blunder fixture for `sts2-rs-21s28`.
# Class: `potion_hoarded_on_death` — fires at end-of-combat when
# the player died while holding usable potions. Only meaningful on
# death; at decision_index=0 a rational MCTS pick avoids death this
# turn so the class can't fire on the recommended action.
#
# Toadpoles t=1, deck empty of potions (we keep potions=[] so the
# class is structurally unreachable on this fixture — the audit
# detector can't flag a non-existent potion as hoarded).
#
# Source: derived from floor004_toadpoles_endturn.toml.

