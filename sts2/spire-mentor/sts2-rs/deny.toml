# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Run manually with `cargo deny check`; deliberately NOT wired into the
# validation gates (see CLAUDE.md — the local gates are the only gates).
# Omitted sections use cargo-deny defaults.

[licenses]
# Permissive-only allowlist. Entries beyond MIT/Apache-2.0 are each pulled in
# by concrete dependencies of this workspace:
#   Apache-2.0 WITH LLVM-exception — target-lexicon (via PyO3)
#   Unicode-3.0                    — unicode-ident (AND-ed with MIT/Apache-2.0)
#   Unlicense                      — memchr / aho-corasick family (MIT dual)
#   BSD-2-Clause                   — zerocopy family duals
#   BSL-1.0                        — xxhash-rust (v0.111 seed hashing, GH #788)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates are unpublished but still MIT (see LICENSE); check them too.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
