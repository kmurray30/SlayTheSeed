act        = "ACT.UNDERDOCKS"
encounter  = "ENCOUNTER.TOADPOLES_WEAK"
room_type  = "monster"
player_outcome = "won"
deck_perfect   = true
relics_perfect = true

[player]
class     = "Ironclad"
ascension = 6
hp        = 54
max_hp    = 80
gold      = 116
deck      = ["STRIKE_IRONCLAD", "STRIKE_IRONCLAD", "STRIKE_IRONCLAD", "STRIKE_IRONCLAD", "STRIKE_IRONCLAD", "DEFEND_IRONCLAD", "DEFEND_IRONCLAD", "DEFEND_IRONCLAD", "DEFEND_IRONCLAD", "BASH", "ASCENDERS_BANE", "WHIRLWIND+", "DOMINATE+"]
relics    = ["BURNING_BLOOD", "SILVER_CRUCIBLE"]
potions   = []

[[monsters]]
