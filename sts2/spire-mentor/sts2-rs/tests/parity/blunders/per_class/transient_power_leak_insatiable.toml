# Per-class blunder fixture for `sts2-rs-21s28`.
# Class: `transient_power_leak` — fires when a transient/expiring
# power buff is wasted (e.g. Strength temporary stacks not consumed
# before turn-end).
#
# Insatiable t=1 opener — no transient powers are active at start of
# combat, so the rational MCTS pick (a 1-cost play) cannot be
# flagged as transient_power_leak. The class label is informational;
# the must_not_pick="End turn" substring gates the assertion.
#
# Source: derived from unused_energy_opener_insatiable_t1.toml.

