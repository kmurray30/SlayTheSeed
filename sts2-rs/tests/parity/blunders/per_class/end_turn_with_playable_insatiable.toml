# Per-class blunder fixture for `sts2-rs-21s28`.
# Class: `end_turn_with_playable` — RedFlagKind::EndTurnWithPlayable
# fires when player ends turn with an affordable card in hand.
# Sibling of `end_turn_with_high_energy`; this fixture targets the
# class label specifically for the per_class/ directory.
#
# Insatiable t=1 opener — deck is loaded with 1-cost cards, so any
# 5-card draw at e=3 includes affordable plays. Rational MCTS pick
# is a card; end_turn_with_playable does not flag the rational pick.
#
# Source: derived from unused_energy_opener_insatiable_t1.toml.

