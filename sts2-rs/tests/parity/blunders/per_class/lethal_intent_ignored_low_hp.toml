# Per-class blunder fixture for `sts2-rs-nhvwo` (q3yiy.1 follow-up).
# Class: `lethal_intent_ignored` — Detector at
# crates/sts2-cli/src/replay/audit.rs:277 fires when the player
# ends turn with `incoming_attack_damage > player_block + player_hp`.
#
# Construction: a floor-7 Phantasmal Gardeners elite encounter
# (4× monsters, each carrying a damage intent) with player HP cut
# to 8 so a single incoming-attack would lethal-kill. Curse/
# status-free deck (per the
# feedback_blunder_fixture_curse_status_poison memo). MCTS at
# sims=2000 must pick a defensive card or a kill-the-attacker line,
# never `End turn` — that would walk into 1-shot death.
#
# Source: derived from floor007_phantasmal_gardeners_endturn.toml.

