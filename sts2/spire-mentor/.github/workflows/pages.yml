# Publishes docs/site/ (static HTML, no build step) to GitHub Pages.
#
# This file lives ONLY in the public repository (added at export from the
# private repo's release/public-overlay/); the private repo runs no Actions.
# One-time setup in the public repo: Settings -> Pages -> Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths: ["docs/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
