# Per-class blunder fixture for `sts2-rs-21s28`.
# Class: `consecutive_skipped_turns` — fires when the player ends
# turn back-to-back without playing cards. At decision_index=0
# only one turn has elapsed, so the class is structurally unable
# to flag the rational pick (needs N≥2 consecutive end-turns).
#
# Bygone Effigy elite t=1; rational MCTS picks a card; even if it
# didn't, decision_index=0 alone cannot exhibit `consecutive`.
#
# Source: derived from floor008_bygone_effigy_endturn.toml.

