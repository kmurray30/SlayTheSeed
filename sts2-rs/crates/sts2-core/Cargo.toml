[package]
name = "sts2-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Deterministic STS2 combat engine: state, hooks, commands, RNG, damage, powers."

[lints]
workspace = true

[features]
# Bead sts2-rs-ung (P8-4): opt-in mimalloc global allocator. Default OFF
# so library consumers don't have a transitive opinion on allocators.
# Only sts2-bench opts in (`--features mimalloc`, default off). The sts2_rs
# Python module (sts2-py, `src/allocator.rs`) and the sts2-cli binaries
# register mimalloc themselves through the workspace dependency, not this
# feature. See `docs/perf-notes-2026-05-12.md`.
mimalloc = ["dep:mimalloc"]
# Bead sts2-rs-1a6: enable the `parity_shrinker` integration test. Default
# OFF — the shrinker is only invoked manually against captured raw fuzz
# failures and must not run in `ci-fast`. See `tests/parity/README.md`
# §Failure-shrinking-loop for the workflow.
shrink = []

[dependencies]
smallvec = { workspace = true, features = ["const_generics", "union"] }
rand = { workspace = true }
rand_xoshiro = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
arc-swap = { workspace = true }
# v0.111.0 seed hashing: `StringHelper.GetDeterministicHashCode` is XxHash64
# of the UTF-8 bytes (GH #788).
xxhash-rust = { workspace = true }
# MCTS-hot state hashing (`hashing.rs`): fixed-seed ahash instead of the
# std SipHash `DefaultHasher` — same ephemeral-cache-key contract, much
# cheaper per byte on the per-node-expansion hash path.
ahash = { workspace = true }
# Optional global allocator. Set as `#[global_allocator]` via the
# `sts2_core::alloc::MiMalloc` reexport when the `mimalloc` feature is on.
mimalloc = { version = "0.1", default-features = false, optional = true }

# Issue #15 / bead sts2-rs-cg5ci: build.rs stamps a content hash of this crate's
# own source into STS2_CORE_SRC_HASH (compiled into the crate as `SRC_HASH`) so
# the parity harness can prove the loaded .so matches its source.
[build-dependencies]
sts2-srchash = { path = "../sts2-srchash" }

# Bead sts2-rs-d19 (P7-8): the enchantment audit + Act-1 fuzz harnesses
# install the full content-side relic / potion / orb registries before
# dispatching. Cargo allows dev-dependency cycles (sts2-content depends
# on sts2-core for the public types; this dev-dep is test-only and never
# enters the library graph).
[dev-dependencies]
hegeltest = "0.14.9"
sts2-content = { workspace = true }
serial_test = { workspace = true }
# Property-based invariant tests for the deterministic RNG (tests/rng_proptest.rs).
proptest = { workspace = true }
# Issue #15 / bead sts2-rs-cg5ci: assert the build-time SRC_HASH stamp equals a
# recompute over the on-disk source (tests/src_hash.rs).
sts2-srchash = { path = "../sts2-srchash" }
