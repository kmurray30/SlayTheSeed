# Per-class blunder fixture for `sts2-rs-21s28`.
# Class: `defend_no_attack_intent` — RedFlagKind::DefendNoAttackIntent
# fires when player plays Defend with no enemy attack intent telegraphed.
#
# Single SEAPUNK at t=1; the enemy *does* have an attack intent on
# turn 1, so a rational MCTS pick (Strike or Bash) is not classified
# as defend_no_attack_intent. The class label is informational; the
# substring must_not_pick="End turn" gates the assertion. Cross-
# validation gate (audit must not flag the rational pick as this
# class) holds trivially.
#
# Source: derived from floor003_seapunk_endturn.toml.

