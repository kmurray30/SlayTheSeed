<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Synergy Catalog — STS2</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, sans-serif;
        background: #1a1a2e;
        color: #ddd;
        padding: 1.5rem;
        line-height: 1.5;
      }

      #app { max-width: 1200px; margin: 0 auto; }

      h1 {
        font-size: 1.6rem;
        color: #e8c98a;
        margin-bottom: 0.4rem;
      }

      #meta {
        font-size: 0.85rem;
        color: #888;
        margin-bottom: 1.2rem;
      }

      /* ── Character selector ── */
      #char-bar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0.4rem 0 0.8rem;
      }
      #char-bar strong { color: #bbb; }
      #character-select {
        background: #252540;
        color: #e8c98a;
        border: 1px solid #555;
        border-radius: 4px;
        padding: 0.3rem 0.6rem;
        font-size: 0.95rem;
        cursor: pointer;
      }
      #character-select:hover { border-color: #e8c98a; }

      /* ── Filters ── */
      #filters {
        margin-bottom: 1rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }

      #filters strong { color: #bbb; margin-right: 0.4rem; }

      .quadrant-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }

      .quadrant-cb {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        cursor: pointer;
        font-size: 0.9rem;
        background: #252540;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 0.25rem 0.6rem;
        user-select: none;
      }

      .quadrant-cb input[type="checkbox"] { cursor: pointer; }

      .swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      /* ── Heatmap / Graph wrap ── */
      #graph-wrap {
        background: #16213e;
        border: 1px solid #333;
        border-radius: 6px;
        margin-bottom: 1.5rem;
        overflow: hidden;
      }

      #heatmap-root {
        width: 100%;
        min-height: 200px;
      }

      /* ── Table ── */
      #table-container { overflow-x: auto; }

      .synergy-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }

      .synergy-table th,
      .synergy-table td {
        padding: 0.45rem 0.7rem;
        text-align: left;
        border-bottom: 1px solid #2a2a4a;
        white-space: nowrap;
      }

      .synergy-table thead th {
        background: #252548;
        color: #c8c8e8;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      .synergy-table thead th:hover { background: #2e2e5e; }

      .synergy-table thead th.sort-active { color: #e8c98a; }

      .sort-arrow { color: #e8c98a; }

      .synergy-table tbody tr:hover { background: #1e1e3a; }

      .synergy-table td:first-child { font-weight: 500; }

      /* ── Status ── */
      #status {
        margin-top: 1rem;
        color: #999;
        font-size: 0.9rem;
      }

      /* ── Graph note ── */
      #graph-note {
        font-size: 0.78rem;
        color: #888;
        padding: 0.25rem 0.7rem;
        background: #16213e;
        border-bottom: 1px solid #333;
        min-height: 1.4em;
      }

      /* ── Column tooltip indicator ── */
      .col-tip-mark {
        font-size: 0.7rem;
        color: #8888bb;
        cursor: help;
        vertical-align: super;
      }

      /* ── Help / legend block ── */
      .help-wrap {
        position: relative;
        margin-left: 0.5rem;
      }

      .help-btn {
        background: #252540;
        border: 1px solid #555;
        border-radius: 50%;
        color: #aaa;
        cursor: pointer;
        font-size: 0.85rem;
        width: 22px;
        height: 22px;
        line-height: 20px;
        text-align: center;
        padding: 0;
      }
      .help-btn:hover, .help-btn-active { background: #3a3a60; color: #e8c98a; }

      .help-body {
        position: absolute;
        top: 28px;
        left: 0;
        z-index: 10;
        background: #1e1e38;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 0.9rem 1rem;
        min-width: 380px;
        max-width: 520px;
        font-size: 0.82rem;
        color: #ccc;
        box-shadow: 0 4px 16px #0008;
      }

      .help-body strong { color: #e8c98a; }
      .help-body ul { margin: 0.5rem 0 0.5rem 1rem; }
      .help-body li { margin-bottom: 0.4rem; }
      .help-note { font-size: 0.78rem; color: #999; margin-top: 0.6rem; }
      .help-note code { background: #2a2a4a; padding: 0 3px; border-radius: 3px; }
      .help-swatch {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        margin-right: 4px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <p style="margin-bottom: 0.4rem;">
        <a href="/index.html" style="color: #8aa9e8; text-decoration: none; font-size: 0.9rem;">← Workbench</a>
      </p>
      <h1>Card Synergy Catalog</h1>
      <section id="char-bar">
        <strong>Character:</strong>
        <select id="character-select" aria-label="Character"></select>
      </section>
      <div id="meta"></div>
      <section id="filters">
        <strong>Quadrant:</strong>
      </section>
      <div id="graph-wrap">
        <div id="heatmap-root"></div>
      </div>
      <div id="table-container"></div>
      <p id="status">Loading…</p>
    </div>
    <script type="module" src="/src/catalog/main.ts"></script>
  </body>
</html>
