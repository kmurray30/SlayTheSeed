[package]
name = "xtask"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "xtask_lib"
path = "src/lib.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"

[lints]
workspace = true
